<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&family=Roboto:wght@300;400;500;700;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <title>Weather Web</title>
</head>

<body>
    <div class="container">
        <div class="search-box">
            <i class="fa-solid fa-location-dot"></i>
            <input type="text" placeholder="Enter your location">
            <button class="fa-solid fa-magnifying-glass"></button>
        </div>

        <div class="not-found">
            <img src="images/404.png" alt="404.png">
            <p>Location not found on Earth!</p>
        </div>

        <div class="popup hidden">
            <img src="images/alert.png" alt="Alert.png">
            <p>
                You are on a timeout, please wait for a few seconds!
            </p>
        </div>

        <div class="weatherOver">
            <img src="">
            <p class="temp"></p>
            <p class="desc"></p>
        </div>

        <div class="weatherInfo">
            <div class="humidity">
                <i class="fa-solid fa-water"></i>
                <div class="text">
                    <span></span>
                    <p>Humidity</p>
                </div>
            </div>
            <div class="wind">
                <i class="fa-solid fa-wind"></i>
                <div class="text">
                    <span></span>
                    <p>Wind Speed</p>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>
            <i class="fa-solid fa-code"></i>
            Created by <a href="https://github.com/KevinSiddhpura">KevinSiddhpura</a>
        </p>
    </footer>

    <script src="https://kit.fontawesome.com/177d47cc3b.js" crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>

</html>
